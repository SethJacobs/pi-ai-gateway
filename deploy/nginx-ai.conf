# AI Gateway — add to nginx-proxy conf.d/
# Proxies /ai/* requests to the ai-gateway Docker container.

location /ai/ {
    proxy_pass http://ai-gateway:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # LLM responses can be slow (especially local inference)
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    # Streaming support (future SSE)
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
}
